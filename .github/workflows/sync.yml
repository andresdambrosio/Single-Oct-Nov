name: Sync planilla

# Baja la planilla del torneo cada 2 horas y commitea si cambió algún resultado.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync
      - run: npm test
      - name: Commit si hay cambios en resultados
        run: |
          # updatedAt cambia siempre; sólo commiteamos si cambió algo más.
          if git diff -U0 data/tournament.json | grep '^[+-] ' | grep -qv '"updatedAt"'; then
            git config user.name "sync-bot"
            git config user.email "sync-bot@users.noreply.github.com"
            git commit -am "Sync resultados desde la planilla"
            git push
          else
            echo "Sin cambios"
          fi
