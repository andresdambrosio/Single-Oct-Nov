<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tini Tennis Tour</title>
  <meta name="description" content="Pronósticos con fichas de juego del torneo de singles de Matías Tini.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="ball" aria-hidden="true"></span>
      <div>
        <h1>Tini Tennis Tour</h1>
        <p class="sub" id="updated"></p>
      </div>
    </div>
    <div class="wallet" title="Fichas de juego, no es plata real">
      <span class="label">Tus fichas</span>
      <strong id="balance">—</strong>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="matches" aria-selected="true">Partidos</button>
    <button role="tab" data-tab="table">Tabla</button>
    <button role="tab" data-tab="ranking">Ranking</button>
    <button role="tab" data-tab="players">Jugadores</button>
    <button role="tab" data-tab="outright">Campeón</button>
    <button role="tab" data-tab="bets">Mis apuestas <span id="open-count" class="pill" hidden></span></button>
  </nav>

  <main id="view"><p class="muted" style="padding:40px 0;text-align:center">Cargando el torneo… 🎾</p></main>

  <footer class="foot">
    Torneo amateur organizado por Matías Tini · Las apuestas son con fichas de juego, sin plata real.
    <a id="source" target="_blank" rel="noopener">Ver planilla</a>
  </footer>

  <dialog id="slip">
    <form method="dialog" id="slip-form">
      <h2 id="slip-title"></h2>
      <p id="slip-desc" class="muted"></p>
      <label>Monto
        <input id="stake" type="number" min="1" step="1" inputmode="numeric" required>
      </label>
      <div class="quick">
        <button type="button" data-q="25">25</button>
        <button type="button" data-q="50">50</button>
        <button type="button" data-q="100">100</button>
        <button type="button" data-q="max">Todo</button>
      </div>
      <p class="payout">Cobrás <strong id="payout">0</strong> si acertás</p>
      <div class="actions">
        <button value="cancel" formnovalidate class="ghost">Cancelar</button>
        <button value="ok" class="primary">Apostar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
